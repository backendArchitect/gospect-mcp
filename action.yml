name: gospect-mcp
description: "Report-first Go code scanner — fail CI on findings, and optionally post them as SARIF code-scanning annotations."
branding:
  icon: search
  color: purple

inputs:
  path:
    description: "Module directory to scan"
    required: false
    default: "."
  patterns:
    description: "Package patterns to scan"
    required: false
    default: "./..."
  fail-on:
    description: "Minimum severity that fails the check: high | medium | low"
    required: false
    default: "high"
  ignore:
    description: "Comma-separated detector names to ignore"
    required: false
    default: ""
  gate:
    description: "Fail the job on findings at/above fail-on. Set to false to only annotate (see sarif)."
    required: false
    default: "true"
  sarif:
    description: "Upload findings as SARIF so they appear as code-scanning annotations. Requires the job to have `security-events: write` permission."
    required: false
    default: "false"
  sarif-category:
    description: "Category for the uploaded SARIF (lets multiple gospect runs coexist in one repo)."
    required: false
    default: "gospect"
  version:
    description: "gospect-mcp version to install (latest | vX.Y.Z | main)"
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Install gospect-mcp
      shell: bash
      run: go install github.com/backendArchitect/gospect-mcp@${{ inputs.version }}

    # SARIF is generated + uploaded BEFORE the gate so annotations post even when the gate fails.
    - name: gospect scan (SARIF)
      if: inputs.sarif == 'true'
      shell: bash
      run: gospect-mcp scan -format sarif "${{ inputs.path }}" ${{ inputs.patterns }} > gospect.sarif
    - name: Upload SARIF
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gospect.sarif
        category: ${{ inputs.sarif-category }}

    - name: gospect check
      if: inputs.gate == 'true'
      shell: bash
      run: |
        gospect-mcp check \
          -fail-on "${{ inputs.fail-on }}" \
          ${{ inputs.ignore && format('-ignore {0}', inputs.ignore) || '' }} \
          "${{ inputs.path }}" ${{ inputs.patterns }}
