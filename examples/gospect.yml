# Example CI workflow for using gospect-mcp in your own Go repository.
#
# Copy this to `.github/workflows/gospect.yml`. It runs the gospect composite
# action (see ../action.yml) on every pull request and push to main: it fails
# the job on high-severity findings, posts them as a PR comment, and uploads
# them as code-scanning annotations.
name: gospect

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write     # required only when comment: true (to post the PR comment)
  security-events: write   # required only when sarif: true (to upload annotations)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: backendArchitect/gospect-mcp@v1
        with:
          path: .            # module directory (or monorepo root)
          patterns: ./...    # package patterns to scan
          fail-on: high      # gate: fail on findings at/above this severity (high|medium|low)
          comment: true      # post (and update) a findings comment on the PR
          sarif: true        # also upload SARIF so findings show as PR annotations
          # ignore: copylocks,todo   # optional: comma-separated detectors to silence
          # gate: false              # optional: report only (comment/annotate), never fail the job
          # version: v1.2.3          # optional: pin a gospect version (default: latest)
