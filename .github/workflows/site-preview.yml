# On any PR that touches the site, post a sticky comment with a live preview link so the redesign
# can be eyeballed before merge. Zero infrastructure — htmlpreview.github.io renders docs/index.html
# straight from the PR branch's raw URL (the page is a single self-contained file). Updates in place
# on every push.
name: site-preview

on:
  pull_request:
    paths: ["docs/index.html"]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.pull_request.head.repo.full_name; // handles forks
            const ref = context.payload.pull_request.head.ref;
            const raw = `https://raw.githubusercontent.com/${repo}/${ref}/docs/index.html`;
            const preview = `https://htmlpreview.github.io/?${raw}`;
            const marker = '<!-- site-preview -->';
            const body = [
              marker,
              '### 🔍 Site preview',
              '',
              `**[Open the rendered site for this PR →](${preview})**`,
              '',
              '_Live from this branch, updates on every push. Rendered by htmlpreview.github.io — fonts and copy-buttons run client-side, so it looks like production but isn\'t the deployed site._',
            ].join('\n');
            const {owner, repo: name} = context.repo;
            const issue_number = context.issue.number;
            const {data: comments} = await github.rest.issues.listComments({owner, repo: name, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo: name, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo: name, issue_number, body});
            }
