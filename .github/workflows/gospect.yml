# Dogfood: gospect scans its own source on every PR / feature-branch push, built FROM SOURCE so it
# reflects unreleased changes. On a PR it posts (and updates) a single sticky comment with the
# findings table, and it fails the job on any high-severity finding. testdata/ is excluded — it
# holds deliberate bugs.
name: gospect

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write   # needed to post the findings comment on a PR

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build gospect from source
        run: go build -o gospect-mcp .

      - name: Scan and render a findings report
        run: |
          ./gospect-mcp scan -quiet -staticcheck -exclude testdata . ./... > findings.json
          python3 - <<'PY' > findings.md
          import json
          r = json.load(open("findings.json"))
          n = r["finding_count"]
          emoji = {"high": "🔴", "medium": "🟠", "low": "🟡"}
          lines = ["<!-- gospect-report -->", "## 🩺 gospect findings", ""]
          if n == 0:
              lines.append("✅ **No findings.** This module is clean.")
          else:
              bysev = r.get("by_severity") or {}
              chips = " · ".join(f'{emoji.get(s,"")} {c} {s}' for s, c in bysev.items())
              lines.append(f"**{n}** finding(s) — {chips}")
              lines.append("")
              lines.append("| | severity | detector | location | message |")
              lines.append("|---|---|---|---|---|")
              for f in r["findings"]:
                  loc = f["file"].split("/")[-1] + ":" + str(f["line"])
                  msg = f["message"].replace("|", "\\|")[:100]
                  lines.append(f'| {emoji.get(f["severity"],"")} | {f["severity"]} | `{f["detector"]}` | `{loc}` | {msg} |')
              lines.append("")
              lines.append("_Bugs are listed first. The job fails only on **high**-severity findings._")
          lines.append("")
          lines.append("<sub>Posted by gospect, built from this branch. testdata/ (deliberate bugs) is excluded.</sub>")
          open("findings.md", "w").write("\n".join(lines))
          PY
          cat findings.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update the findings comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('findings.md', 'utf8');
            const marker = '<!-- gospect-report -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Gate — fail on high-severity findings
        run: ./gospect-mcp check -quiet -fail-on high -exclude testdata . ./...
