name: release

# Auto-release on every push to main: test -> patch-bump a tag -> build cross-platform
# binaries -> publish a GitHub Release. Put "[skip release]" in the commit message to skip.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write   # push the Docker image to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  # Gate the release on the same end-to-end dogfood the PR runs, so a regression can't reach a
  # release even when it lands straight on main.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -o gospect-mcp .
      - name: The fixture's high-severity bugs must fail the gate
        run: |
          set +e; ./gospect-mcp check -quiet -fail-on high testdata/buggy ./...; code=$?; set -e
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1 on testdata/buggy, got $code"; exit 1; }
      - name: gospect must stay clean on its own source
        run: ./gospect-mcp check -quiet -fail-on high -exclude testdata . ./...

  tag:
    needs: [test, selftest]
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next tag (patch bump)
        id: next
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r a b c <<< "${latest#v}"
            next="v${a}.${b}.$((c + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: $next (previous: ${latest:-none})"
      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.tag }}" -m "Release ${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build & package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          bin="gospect-mcp"
          [ "$GOOS" = "windows" ] && bin="gospect-mcp.exe"
          ldflags="-s -w -X github.com/backendArchitect/gospect-mcp/internal/selfupdate.injected=${TAG}"
          go build -trimpath -ldflags="$ldflags" -o "$bin" .
          name="gospect-mcp_${TAG}_${GOOS}_${GOARCH}"
          tar -czf "${name}.tar.gz" "$bin"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256

  docker:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: docker/setup-qemu-action@v3        # for arm64 emulation
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name          # GHCR repository names must be lowercase
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.tag.outputs.tag }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.tag.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
